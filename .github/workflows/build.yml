name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar formato
        run: npm run format:check

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verificar que los assets derivados estan al dia
        run: npm run check:assets

      - name: Guardar dist como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
