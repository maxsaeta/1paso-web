<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="neuroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#006E54;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#84DAB9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="neuroGradText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#006E54;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#84DAB9;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="512" cy="512" r="512" fill="#FDFDF8"/>

  <!-- Outer ring - progress/timer reference -->
  <circle cx="512" cy="512" r="450" fill="none" stroke="url(#neuroGrad)" stroke-width="16" stroke-linecap="round" stroke-dasharray="300 100 150 100" opacity="0.3"/>

  <!-- Inner accent circle -->
  <circle cx="512" cy="512" r="380" fill="none" stroke="url(#neuroGrad)" stroke-width="4" opacity="0.2"/>

  <!-- Stylized N shape (NeuroPaso) -->
  <path d="M 280 680 
           L 280 344 
           Q 280 280 344 280 
           L 680 280 
           Q 744 280 744 344 
           L 744 680" 
       fill="none" 
       stroke="url(#neuroGrad)" 
       stroke-width="56" 
       stroke-linecap="round"
       stroke-linejoin="round"/>

  <!-- Right arrow (progress forward) -->
  <path d="M 760 512 
           L 880 512 
           L 880 472 
           L 960 512 
           L 880 552 
           L 880 512 
           L 760 512" 
       fill="url(#neuroGrad)" 
       stroke="none"/>

  <!-- Check mark inside N (completion) -->
  <path d="M 344 472 
           L 440 568 
           L 624 368" 
       fill="none" 
       stroke="#FDFDF8" 
       stroke-width="40" 
       stroke-linecap="round"
       stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="512" y="820" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="96" font-weight="800" fill="url(#neuroGradText)">NEUROPASO</text>
  <text x="512" y="880" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="32" font-weight="400" fill="#404944">Un paso a la vez</text>
</svg>