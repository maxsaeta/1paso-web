[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Cache Astro assets
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache font files and assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Landing page
[[redirects]]
  from = "/landing"
  to = "/landing/index.html"
  status = 200

# App info page
[[redirects]]
  from = "/app"
  to = "/app/index.html"
  status = 200

# Root redirects to landing
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

# 404 for everything else (no SPA fallback)
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404