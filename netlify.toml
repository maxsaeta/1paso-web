[build]
  command = "npm install && npx expo export --platform web && cp -r legal dist/legal"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  EXPO_CLI_TELEMETRY_DISABLED = "1"

# SPA catch-all (must be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
