[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Cache Astro assets
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache font files and assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Manual de uso en PDF: se cachea 1 día, no un año, porque cambia con cada
# versión de la app y no lleva hash en el nombre.
[[headers]]
  for = "/manual/*"
    [headers.values]
    Cache-Control = "public, max-age=86400"
    X-Content-Type-Options = "nosniff"

# La pagina principal redirige a la landing, que vive en /landing
# (src/pages/landing/index.astro). El orden importa: esta regla tiene que
# ir antes del 404 general, porque Netlify aplica la primera que coincide.
[[redirects]]
  from = "/"
  to = "/landing/"
  status = 301

# App info page
[[redirects]]
  from = "/app"
  to = "/app/index.html"
  status = 200

# Cualquier ruta desconocida responde con la landing y codigo 404, para
# que nadie aterrice en un pagina muerta (cambio de fcafdf9).
[[redirects]]
  from = "/*"
  to = "/landing"
  status = 404
