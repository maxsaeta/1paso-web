[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Cache Astro assets
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache font files and assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Manual de uso en PDF: se cachea 1 día, no un año, porque cambia con cada
# versión de la app y no lleva hash en el nombre.
[[headers]]
  for = "/manual/*"
    [headers.values]
    Cache-Control = "public, max-age=86400"
    X-Content-Type-Options = "nosniff"

# Landing: la portada vive en / (src/pages/index.astro). /landing es un alias
# permanente para no romper los enlaces antiguos que lo usaban.
[[redirects]]
  from = "/landing"
  to = "/"
  status = 301

# App info page
[[redirects]]
  from = "/app"
  to = "/app/index.html"
  status = 200

# 404 for everything else (no SPA fallback)
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404